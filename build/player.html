<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" value="notranslate"><meta name="description" content="PineWarp is a powerful Scratch mod that enhances your Scratch experience with advanced features and optimizations."/><meta property="og:title" content="PineWarp - Elevate your creation"/><meta property="og:description" content="PineWarp is a powerful Scratch mod that enhances your Scratch experience with advanced features and optimizations."/><meta property="og:type" content="website"/><meta property="og:image" content="/images/apple-touch-icon.png"/><meta property="og:url" content="https://com.bilup.org/"/><title>PineWarp - Elevate your creation</title><link rel="apple-touch-icon" href="/images/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><style>.splash-screen {

        'use strict';

        var theme = '';
        var accent = '#75C1C4';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            theme = parsed.gui || 'light';
            accent = parsed.accent || accent;
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.querySelector('.spash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        splash.style.color = accent;
        splash.hidden = false;

        var splashErrorTitle = document.querySelector('.splash-error-title');
        var splashError = document.querySelector('.splash-errors');
        var splashReset = document.querySelector('.splash-reset');

        var totalErrors = 0;
        window.onerror = function (event, source, line, col, err) {
          if (++totalErrors > 5) return; // dont bother logging more
          splashErrorTitle.hidden = splashError.hidden = splashReset.hidden = false;
          var el = document.createElement('div');
          el.textContent = 'Error (splash) in ' + source + ' (' + line + ':' + col + '): ' + err;
          splashError.appendChild(el);
        };

        splashReset.onclick = function () {
          splashReset.disabled = true;
          function hardRefresh() {
            var search = location.search.replace(/[?&]nocache=[\d.]+(?=$|&)/, '');
            // This is a functional cookie used so that we respond with Clear-Site-Data just once. No tracking.
            // Can't use nocache parameter to trigger this because people might accidentally bookmark that, and
            // then we would be clearing their cache on every visit.
            document.cookie = 'tw_clear_cache_once=1; max-age=60; path=/; samesite=strict; secure';
            location.replace(location.pathname + search + (search ? '&' : '?') + 'nocache=' + Math.floor(Math.random() * 10000000));
          }
          if ('serviceWorker' in navigator) {
            setTimeout(hardRefresh, 5000);
            navigator.serviceWorker.getRegistration("/")
              .then(function(registration) {
                if (registration) {
                  return registration.unregister();
                }
              })
              .then(hardRefresh)
              .catch(hardRefresh);
          } else {
            hardRefresh();
          }
        };

        window.SplashEnd = () => {
          splash.hidden = true;
          window.onerror = null;
        };
      })();</script><div id="app"></div><script src="/js/gleba/git-libs.8784c4d83102d0293385.js"></script><script src="/js/gleba/scratch-engine.cdd4d6cffb6869bbf986.js"></script><script src="/js/gleba/scratch-paint.f833f4b80bd2c0cb9260.js"></script><script src="/js/gleba/vendors~addon-settings~community~editor~embed~fullscreen~player.9276e481d090b3240635.js"></script><script src="/js/gleba/vendors~community~editor~embed~fullscreen~player.d6fac7d712920df72046.js"></script><script src="/js/gleba/vendors~editor~embed~fullscreen~player.aeeafd6403cd42207c4d.js"></script><script src="/js/gleba/addon-settings~community~editor~embed~fullscreen~player.519035ae8cfb7a7184f9.js"></script><script src="/js/gleba/community~editor~embed~fullscreen~player.0e20ba018fe1d18d1ef6.js"></script><script src="/js/gleba/addon-settings~editor~embed~fullscreen~player.1257dd82fbf0037e85a3.js"></script><script src="/js/gleba/editor~embed~fullscreen~player.3821eceaf414ae311f71.js"></script><script src="/js/gleba/editor~fullscreen~player.a8898e823f1ebc1b19eb.js"></script><script src="/js/gleba/player.4228c64571609a20cd0b.js"></script></body></html>
